<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Ký Học Viên</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f9ff, #e2e8f0);
            padding: 40px 20px;
            color: #1f2937;
        }

        .registration-card {
            background: #ffffff;
            max-width: 700px;
            margin: 0 auto;
            padding: clamp(20px, 3vw, 35px);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.08);
        }

        .registration-card h2 {
            text-align: center;
            color: #1d4ed8;
            margin-top: 0;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-size: clamp(1.5rem, 3vw, 2rem);
            border-bottom: 2px solid #dbeafe;
            padding-bottom: 15px;
        }

        form {
            display: grid;
            gap: 18px;
        }

        .form-row {
            display: grid;
            gap: 8px;
        }

        .form-row label.field-label {
            font-weight: 600;
            color: #334155;
        }

        .required {
            color: #ef4444;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
            background-color: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 22px;
            align-items: center;
        }

        .option-group label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(0.98);
        }

        .btn-submit {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
        }

        .btn-reset {
            background: #e2e8f0;
            color: #1f2937;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .registration-card {
                border-radius: 12px;
            }

            .actions {
                flex-direction: column;
            }

            .option-group {
                gap: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="registration-card">
        <h2>Đăng Ký Học Viên</h2>

        <form action="#" method="POST">
            <div class="form-row">
                <label class="field-label" for="fullname">Họ và tên <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <div class="form-row">
                <label class="field-label" for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="nguyenvana@gmail.com" required>
            </div>

            <div class="form-row">
                <label class="field-label" for="phone">Số điện thoại <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" required>
            </div>

            <div class="form-row">
                <label class="field-label" for="birthday">Ngày sinh</label>
                <input type="date" id="birthday" name="birthday">
            </div>

            <div class="form-row">
                <label class="field-label">Giới tính</label>
                <div class="option-group">
                    <label><input type="radio" name="gender" value="nam" checked> Nam</label>
                    <label><input type="radio" name="gender" value="nu"> Nữ</label>
                    <label><input type="radio" name="gender" value="khac"> Khác</label>
                </div>
            </div>

            <div class="form-row">
                <label class="field-label" for="address">Địa chỉ</label>
                <textarea id="address" name="address" rows="2" placeholder="Nhập địa chỉ cư trú"></textarea>
            </div>

            <div class="form-row">
                <label class="field-label" for="course">Khóa học đăng ký</label>
                <select id="course" name="course">
                    <option value="html_css">HTML & CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="python">Python</option>
                </select>
            </div>

            <div class="form-row">
                <label class="field-label">Hình thức học</label>
                <div class="option-group">
                    <label><input type="radio" name="study_type" value="online" checked> Online</label>
                    <label><input type="radio" name="study_type" value="offline"> Offline</label>
                </div>
            </div>

            <div class="form-row">
                <label class="field-label">Sở thích</label>
                <div class="option-group">
                    <label><input type="checkbox" name="hobby" value="coding"> Lập trình</label>
                    <label><input type="checkbox" name="hobby" value="reading"> Đọc sách</label>
                    <label><input type="checkbox" name="hobby" value="sports"> Thể thao</label>
                    <label><input type="checkbox" name="hobby" value="music"> Âm nhạc</label>
                </div>
            </div>

            <div class="form-row">
                <label class="field-label" for="note">Ghi chú thêm</label>
                <textarea id="note" name="note" rows="3" placeholder="Nhập yêu cầu hoặc câu hỏi thêm (nếu có)"></textarea>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-submit">Đăng ký</button>
                <button type="reset" class="btn btn-reset">Nhập lại</button>
            </div>
        </form>
    </div>

</body>
</html>
