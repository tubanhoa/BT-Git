<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch họp công ty</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            color: #1f2937;
            padding: 30px 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
            padding: clamp(20px, 3vw, 32px);
        }

        h1 {
            margin: 0 0 18px;
            color: #1d4ed8;
            text-align: center;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 12px 14px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: #dbeafe;
            color: #1e3a8a;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #eff6ff;
        }

        @media (max-width: 640px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 15px 10px;
                border-radius: 10px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Lịch họp công ty</h1>

        <table>
            <thead>
                <tr>
                    <th>Ngày</th>
                    <th>Giờ</th>
                    <th>Nội dung cuộc họp</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td rowspan="2">12/10/2026</td>
                    <td>08:30 - 10:00</td>
                    <td>Họp giao ban đầu tuần</td>
                </tr>
                <tr>
                    <td>10:30 - 11:30</td>
                    <td>Review tiến độ dự án A</td>
                </tr>

                <tr>
                    <td>13/10/2026</td>
                    <td colspan="2">08:00 - 17:00: Hội thảo Kế hoạch Chiến lược (Họp kéo dài cả ngày)</td>
                </tr>

                <tr>
                    <td>14/10/2026</td>
                    <td>14:00 - 15:30</td>
                    <td>Phỏng vấn nhân sự mới</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
