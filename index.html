<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chèn hình ảnh trong HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #f9f9f9;
        }
        img {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <h1>Hình ảnh thiên nhiên yêu thích</h1>

    <!-- Chèn hình ảnh kèm thuộc tính alt mô tả -->
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" 
         alt="Bãi biển hoang sơ tuyệt đẹp với cát trắng mịn và nước biển xanh ngọc" 
         width="600">

</body>
</html>
