<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên kết yêu thích</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách liên kết -->
    <ul>
        <!-- 1. Trang web bên ngoài mở trong tab mới với target="_blank" -->
        <li>
            <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Trang tìm kiếm Google (Mở tab mới)</a>
        </li>

        <!-- 2. Trang web bên ngoài khác -->
        <li>
            <a href="https://vi.wikipedia.org" target="_blank" rel="noopener noreferrer">Bách khoa toàn thư Wikipedia</a>
        </li>

        <!-- 3. Liên kết tới file HTML khác trong cùng thư mục -->
        <li>
            <a href="about.html">Xem trang Giới thiệu (about.html)</a>
        </li>

        <!-- 4. Liên kết gửi email -->
        <li>
            <a href="mailto:narukun2812@gmail.com">Gửi email liên hệ cho tôi (narukun2812@gmail.com)</a>
        </li>
    </ul>

</body>
</html>
