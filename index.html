<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3f4f6, #eff6ff);
            color: #1f2937;
            padding: 30px 15px;
        }

        .wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: clamp(20px, 4vw, 30px);
        }

        h1 {
            margin: 0 0 20px;
            color: #1d4ed8;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            overflow: hidden;
            border-radius: 10px;
        }

        th, td {
            border: 1px solid #d1d5db;
            padding: 12px 14px;
            text-align: left;
        }

        th {
            background: #dbeafe;
            color: #1e3a8a;
            font-weight: 700;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #eff6ff;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            .wrapper {
                padding: 15px 10px;
                border-radius: 10px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.92rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Danh sách sản phẩm</h1>

        <table>
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Giá</th>
                    <th>Số lượng</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Điện thoại iPhone 15</td>
                    <td>22.990.000 VNĐ</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Laptop Dell XPS 13</td>
                    <td>31.500.000 VNĐ</td>
                    <td>5</td>
                </tr>
                <tr>
                    <td>Tai nghe Bluetooth Sony</td>
                    <td>4.200.000 VNĐ</td>
                    <td>15</td>
                </tr>
                <tr>
                    <td>Đồng hồ Apple Watch</td>
                    <td>9.800.000 VNĐ</td>
                    <td>8</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
